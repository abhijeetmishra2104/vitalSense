; VitalSense ESP32 firmware.
;
; The platform version is pinned deliberately. The Arduino-ESP32 core changed its
; hardware-timer API incompatibly between 2.x and 3.x, and a build that silently moves
; to a new core is a build whose sampling behaviour can change without anyone editing a
; line - which is the opposite of what a 360 Hz acquisition path needs (D-30).
;
; Note what is NOT here: the signal processing. vs_notch.c, vs_ringbuf.c, vs_leadsoff.c
; and vs_frame.c are plain C99 with no Arduino dependency, so the same files are built
; and tested on the host by firmware/test/Makefile (D-25). This environment adds only
; the target-specific shell: pins, tasks, WiFi, WebSocket.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    links2004/WebSockets@^2.6.1

build_flags =
    -Wall
    -Wextra
    ; WiFi and server details come from firmware/include/vs_secrets.h, which is
    ; gitignored. Credentials do not belong in a public repository, and a template is
    ; committed in its place.
    -I include

; The host test build lives in firmware/test/Makefile, not here - PlatformIO's native
; platform would pull in a second toolchain to do what `cc` already does.

[env:wokwi]
; The same firmware, built for the Wokwi ESP32 simulator. Wokwi has no route to a local
; ingest server, so this environment swaps the transport for the serial port - the
; frames are byte-identical, because both transports call the same vs_frame_build().
;
; What this buys without a board: the timer ISR, the FreeRTOS task layout, the notch,
; the leads-off debounce and the frame builder all running on a simulated ESP32, with a
; potentiometer standing in for the AD8232 output and a switch for the LO pins.
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DVS_TRANSPORT_SERIAL
lib_deps =
